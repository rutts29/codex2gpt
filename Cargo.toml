[package]
name = "codex2gpt"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }

[dev-dependencies]
tower-service = "=0.3.3"
